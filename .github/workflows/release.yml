name: Release

# Fires on a pushed semver tag. GoReleaser builds/signs/publishes; nothing here
# runs on branch pushes or PRs (CI is the separate ci.yml).
on:
  push:
    tags:
      - "v*"

# Least privilege, scoped to what a release needs:
#   contents      — create the GitHub Release + upload assets
#   packages      — push the Docker image to ghcr.io
#   id-token      — mint the OIDC token cosign uses for keyless signing
permissions:
  contents: write
  packages: write
  id-token: write

# Single-flight: a fixed group (not ${{ github.ref }}, which differs per tag)
# serializes releases so two tags pushed close together can't race on the mutable
# ghcr :latest manifest. Never cancel — a half-finished release must complete.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4 — full history + tags so the changelog/version resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # actions/setup-go v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "stable"
          cache: true

      # docker/setup-qemu-action v3 — emulation so the arm64 image builds on the
      # amd64 runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      # docker/setup-buildx-action v3 — buildx driver for the multi-arch images.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # docker/login-action v3 — authenticate to ghcr with the workflow token.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sigstore/cosign-installer v3 — provides the cosign binary GoReleaser calls
      # for keyless checksum signing.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      # goreleaser/goreleaser-action v6 — run the full release on the tag.
      # GoReleaser itself is pinned to an exact version for reproducible releases
      # (bump deliberately; Dependabot pins the action SHA, not this input).
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "v2.8.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal-access token with `contents:write` on go2-im/homebrew-tap, so
          # GoReleaser can push the formula to the tap repo. Configure it as a repo
          # secret; the brews step is skipped for prerelease tags.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
