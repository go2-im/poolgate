name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# Read-only: this job holds no secrets (release signing lives in a separate workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per docs/SECURITY.md (audit finding C) — actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # Keep the compiler and analysis tools on the exact patched toolchain
          # required by go.mod. Using 'stable' can move CI to a newer Go export
          # data format before staticcheck supports it.
          go-version: '1.25.13'
          cache: true

      - name: build
        run: go build ./...

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"; echo "$unformatted"
            exit 1
          fi
          echo "gofmt: OK"

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: test (race + coverage)
        shell: bash
        run: |
          set -euo pipefail
          go test -race -covermode=atomic -coverprofile=cover.out ./... | tee test.out

      - name: coverage gate (>=80% per package — DESIGN §25)
        shell: bash
        run: |
          set -euo pipefail
          # Fail if any package that has statements reports < 80% coverage.
          awk '
            /coverage:/ {
              for (i = 1; i <= NF; i++) {
                if ($i == "coverage:") {
                  c = $(i+1); sub(/%/, "", c)
                  if (c + 0 < 80.0) { printf "COVERAGE FAIL: %s\n", $0; fail = 1 }
                }
              }
            }
            END { if (fail) exit 1; else print "coverage gate: OK (all packages >= 80%)" }
          ' test.out
          echo "total: $(go tool cover -func=cover.out | tail -1)"

      - name: govulncheck
        # Blocking: stdlib CVEs are addressed by the pinned `toolchain` directive
        # in go.mod (>= go1.25.13) plus setup-go's exact version, so a clean run is
        # expected. If Go discloses a new CVE, bump the toolchain directive.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: suspicious-domain lint
        shell: bash
        run: |
          set -euo pipefail
          # Guard against typosquat domains in source/config (audit finding K).
          # Exclude .git and .github so this pattern doesn't match its own workflow file.
          if grep -RInE 'openrouter\.icu|api\.0penai|chatgqt' \
              --include='*.go' --include='*.yaml' --include='*.yml' --include='*.ts' --include='*.tsx' \
              --exclude-dir='.git' --exclude-dir='.github' . ; then
            echo "suspicious domain found"; exit 1
          fi
          echo "domain lint: OK"

  # Frontend build gate (DESIGN §0 D10 / §CI): rebuild the admin SPA from source with
  # the committed public-registry lockfile and verify the embedded internal/webui/dist
  # matches — so a stale/hand-edited bundle can never ship. The Go binary embeds dist,
  # so `go build` itself needs no npm; this job is the only place the frontend is built.
  frontend:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 (SHA-pinned per docs/SECURITY.md — audit finding C)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4.4.0 (SHA-pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # The committed dist must be reproduced BYTE-IDENTICALLY here. The bundler
          # is vite 8 (rolldown/lightningcss native binaries) + TypeScript 7 (tsgo),
          # all pinned by the committed lockfile; Node is only the host runtime. If a
          # future toolchain bump makes the output non-reproducible across platforms,
          # the verify step below fails CLOSED (blocks the merge) — it never ships a
          # mismatch. A red gate means "rebuild locally (cd web && npm ci && npm run
          # build) and commit the result", not "flaky".
          node-version: '22'

      - name: install (npm ci — exact deps from the committed public-registry lockfile)
        working-directory: web
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: build the admin SPA
        working-directory: web
        run: npm run build

      - name: verify embedded dist matches source
        shell: bash
        run: |
          set -euo pipefail
          # --porcelain catches modified AND newly-added/removed files (git diff
          # --exit-code alone misses untracked additions).
          if [ -n "$(git status --porcelain -- internal/webui/dist)" ]; then
            echo "internal/webui/dist does not match a fresh build:"
            git status --porcelain -- internal/webui/dist
            git diff -- internal/webui/dist || true
            echo "Fix: cd web && npm ci && npm run build, then commit internal/webui/dist."
            exit 1
          fi
          echo "embedded dist: up to date"
