name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# Read-only: this job holds no secrets (release signing lives in a separate workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per docs/SECURITY.md (audit finding C) — actions/checkout@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # 'stable' installs the latest patched toolchain (>= go.mod's 1.25.0),
          # so govulncheck doesn't flag already-fixed stdlib CVEs.
          go-version: 'stable'
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: test (race + coverage)
        shell: bash
        run: |
          set -euo pipefail
          go test -race -covermode=atomic -coverprofile=cover.out ./... | tee test.out

      - name: coverage gate (>=80% per package — DESIGN §25)
        shell: bash
        run: |
          set -euo pipefail
          # Fail if any package that has statements reports < 80% coverage.
          awk '
            /coverage:/ {
              for (i = 1; i <= NF; i++) {
                if ($i == "coverage:") {
                  c = $(i+1); sub(/%/, "", c)
                  if (c + 0 < 80.0) { printf "COVERAGE FAIL: %s\n", $0; fail = 1 }
                }
              }
            }
            END { if (fail) exit 1; else print "coverage gate: OK (all packages >= 80%)" }
          ' test.out
          echo "total: $(go tool cover -func=cover.out | tail -1)"

      - name: govulncheck
        # Advisory: reports vulns in logs but does not block merges. Stdlib CVEs
        # get fixed by bumping the Go toolchain (setup-go 'stable'), not our code,
        # so a hard gate here would flake on Go's disclosure schedule.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: suspicious-domain lint
        shell: bash
        run: |
          set -euo pipefail
          # Guard against typosquat domains in source/config (audit finding K).
          # Exclude .git and .github so this pattern doesn't match its own workflow file.
          if grep -RInE 'openrouter\.icu|api\.0penai|chatgqt' \
              --include='*.go' --include='*.yaml' --include='*.yml' --include='*.ts' --include='*.tsx' \
              --exclude-dir='.git' --exclude-dir='.github' . ; then
            echo "suspicious domain found"; exit 1
          fi
          echo "domain lint: OK"
