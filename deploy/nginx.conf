# nginx.conf — alternative to the Caddyfile for operators who already run nginx.
#
# This is a server-blocks fragment; drop it under http {} (e.g.
# /etc/nginx/conf.d/poolgate.conf). It assumes nginx can resolve the `poolgate`
# host (same docker network, or replace with 127.0.0.1:PORT if you publish the
# ports on the host instead). TLS certs are left to your existing setup (certbot
# / a mounted cert) — the ssl_certificate lines below are placeholders.
#
# CRITICAL for poolgate: both surfaces stream Server-Sent Events (the proxy
# relays the upstream completion stream; the admin UI has a live monitor feed).
# `proxy_buffering off;` + HTTP/1.1 + no read timeout are required, otherwise
# nginx batches or times out the stream.

# Shared streaming/proxy settings, included by both server blocks.
# (Inline here rather than a separate file so this fragment is self-contained.)

# --- OpenAI-compatible proxy API -------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.example.com/privkey.pem;

    # Long-lived streaming completions can run for minutes.
    client_max_body_size 10m;

    location / {
        proxy_pass http://poolgate:8787;
        proxy_http_version 1.1;

        # SSE: never buffer, never batch, never time the stream out.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";      # keep the upstream connection alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin UI + REST API ----------------------------------------------------
# HTTPS is mandatory: WebAuthn/passkeys require a secure context, and the
# hostname must match rp_id / external_origin in config.yaml.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.example.com/privkey.pem;

    # Optional defense-in-depth: allow only your own IPs to the admin surface.
    # This is in addition to poolgate's passkey session auth + CSRF + CSP.
    # allow 203.0.113.0/24;
    # deny  all;

    location / {
        proxy_pass http://poolgate:7070;
        proxy_http_version 1.1;

        # The admin live monitor is an SSE stream — same no-buffer rules.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect plaintext to HTTPS for both names.
server {
    listen 80;
    server_name api.example.com admin.example.com;
    return 308 https://$host$request_uri;
}
